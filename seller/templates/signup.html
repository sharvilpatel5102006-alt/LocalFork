{% extends "base.html" %}
{% block title %}Start selling{% endblock %}
{% block content %}
  <h1>Start selling on LocalFork</h1>
  <p class="muted">Set up your account and your seller page in one go.</p>
  <form method="post" enctype="multipart/form-data" class="form">
    <label>Your name <input type="text" name="name" value="{{ form.get('name','') }}" required></label>
    <label>Email <input type="email" name="email" value="{{ form.get('email','') }}" required></label>
    <label>Password <input type="password" name="password" required minlength="6"></label>

    <hr style="border:none;border-top:1px solid var(--border);margin:6px 0;">

    <label>Business or cook name <input type="text" name="business_name" value="{{ form.get('business_name','') }}" required placeholder="e.g. Maria's Kitchen"></label>
    <label>City / neighborhood <input type="text" name="city" value="{{ form.get('city','') }}" required></label>
    <label>Cuisine / specialty <input type="text" name="cuisine" value="{{ form.get('cuisine','') }}" placeholder="e.g. Homestyle Mexican"></label>
    <label>Short bio <textarea name="bio" rows="3">{{ form.get('bio','') }}</textarea></label>
    <label>Business photo (optional) <input type="file" name="photo" accept="image/*"></label>
    <label>Emoji (used if no photo is set) <input type="text" name="emoji" value="{{ form.get('emoji','🍽️') }}" maxlength="4"></label>

    <button type="submit" class="btn">Create my seller page</button>
  </form>
  <p class="muted">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
{% endblock %}
