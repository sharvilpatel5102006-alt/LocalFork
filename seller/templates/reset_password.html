{% extends "base.html" %}
{% block title %}Set a new password{% endblock %}
{% block content %}
  <h1>Set a new password</h1>
  <form method="post" class="form narrow">
    <label>New password <input type="password" name="password" required minlength="6"></label>
    <label>Confirm new password <input type="password" name="confirm" required minlength="6"></label>
    <button type="submit" class="btn">Update password</button>
  </form>
{% endblock %}
